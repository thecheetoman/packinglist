{% extends 'base.html' %}
{% block content %}
<a href="/leads" class="back-link">&larr; Back to Leads</a>

<div class="admin-page">
  <h2>Edit {% if kind == 'part' %}Screw / Part{% else %}Tool{% endif %}</h2>

  <div class="admin-card">
    <form method="post">
      <div class="form-group">
        <label>Name</label>
        <input class="form-input" name="tool" value="{{ item.tool }}" required>
      </div>
      <div class="form-group">
        <label>Where to put</label>
        <select class="form-select" name="location">
          <option value="">— Select —</option>
          {% for loc in locations %}
            <option value="{{ loc }}" {% if item.location == loc %}selected{% endif %}>{{ loc }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Where to find</label>
        <input class="form-input" name="where_to_find" value="{{ item.where_to_find or '' }}">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input class="form-input" name="quantity" value="{{ item.quantity or '' }}">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-yellow">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
