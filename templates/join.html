{% extends 'base.html' %}
{% block content %}
<div class="form-card">
  <h2>Join</h2>
  <p>Enter the access password and your lead provided username to join.</p>
  <form method="post">
    <div class="form-group">
      <label for="username">Username</label>
      <input class="form-input" id="username" name="username" required>
    </div>
    <div class="form-group">
      <label for="password">Access Password(Ask a lead)</label>
      <input class="form-input" id="password" name="password" type="password" required autofocus>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-yellow">Go</button>
    </div>
  </form>
  <div style="margin-top:12px;text-align:center">
    <a href="/leads/login" class="btn" style="text-decoration:none">Open Leads Mode</a>
  </div>
</div>
{% endblock %}
